# "Prod" overrides, used by: ./scripts/deploy.sh prod
# Still local Minikube, but practising a production-shaped setup:
# a pinned image tag, 2 replicas of app and web, more resources.
# Passwords come from prod.secrets.yaml (generated by deploy.sh, git-ignored).

app:
  image:
    repository: selfapp-lite
    tag: v1 # pinned tag, never :latest in "prod"
    pullPolicy: IfNotPresent
  replicaCount: 2
  resources:
    requests:
      cpu: 150m
      memory: 320Mi
    limits:
      cpu: 600m
      memory: 640Mi

web:
  image:
    repository: selfapp-lite-web
    tag: v1
    pullPolicy: IfNotPresent
  replicaCount: 2

mysql:
  persistence:
    size: 2Gi
  resources:
    requests:
      cpu: 150m
      memory: 384Mi
    limits:
      cpu: 600m
      memory: 1Gi

ingress:
  host: selfapp.local
