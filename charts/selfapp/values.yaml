# Default values for the selfapp chart.
# Environment overrides: values-dev.yaml / values-prod.yaml.
# Passwords: <env>.secrets.yaml, generated by scripts/deploy.sh (git-ignored).

# -----------------------------------------------------------------------
# Images (built from docker-buildlab-selfapp)
# -----------------------------------------------------------------------
# Defaults point at Docker Hub, as in docker-compose.yml
# (${DOCKERHUB_USER}/selfapp-lite:v1). On Minikube, deploy.sh builds the
# images locally and values-dev/values-prod override these names.

app:
  image:
    repository: CHANGE_ME/selfapp-lite
    tag: v1
    pullPolicy: IfNotPresent
  replicaCount: 1
  containerPort: 8080 # app/Dockerfile: EXPOSE 8080
  # Add prometheus.io/* annotations so a Prometheus running in the cluster
  # can find /actuator/prometheus (see observability-selfapp)
  prometheusScrape: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

web:
  image:
    repository: CHANGE_ME/selfapp-lite-web
    tag: v1
    pullPolicy: IfNotPresent
  replicaCount: 1
  containerPort: 80 # web/Dockerfile: EXPOSE 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

mysql:
  image:
    repository: mysql
    tag: "8.0"
    pullPolicy: IfNotPresent
  # Placeholders only. Real passwords come from <env>.secrets.yaml.
  rootPassword: CHANGE_ME
  database: selfapplite
  username: selfuser
  password: CHANGE_ME
  persistence:
    enabled: true
    size: 1Gi
    storageClassName: standard # Minikube's default StorageClass
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi # MySQL 8 gets OOMKilled during first start below this

# -----------------------------------------------------------------------
# RabbitMQ: required, the app publishes/consumes "user.created" events.
# Disabling it also turns off the app's Rabbit health check, so the app
# still starts, but messaging won't work.
# -----------------------------------------------------------------------
rabbitmq:
  enabled: true
  image:
    repository: rabbitmq
    tag: "3.13-management-alpine" # same image as docker-compose.yml
    pullPolicy: IfNotPresent
  username: selfmq
  password: CHANGE_ME # placeholder, real one comes from <env>.secrets.yaml
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# -----------------------------------------------------------------------
# Ingress (Minikube's ingress addon registers the "nginx" class)
# -----------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  host: selfapp.local
  annotations:
    # Sticky sessions: login sessions live in each app pod's memory, so a
    # cookie keeps each browser on the same web pod, and the app Service's
    # sessionAffinity keeps each web pod on the same app pod.
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "selfapp-route"

# -----------------------------------------------------------------------
# Service types
# -----------------------------------------------------------------------
service:
  webType: ClusterIP # reached through the Ingress; use NodePort to skip it
