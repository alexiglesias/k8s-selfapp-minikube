# Dev overrides, used by: ./scripts/deploy.sh dev
# Images are built straight into Minikube (minikube image build), so no
# registry is needed: pullPolicy Never means "only use the local image".
# Passwords come from dev.secrets.yaml (generated by deploy.sh, git-ignored).

app:
  image:
    repository: selfapp-lite
    tag: dev
    pullPolicy: Never
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      cpu: "1" # Spring Boot needs CPU to start in reasonable time
      memory: 384Mi

web:
  image:
    repository: selfapp-lite-web
    tag: dev
    pullPolicy: Never
  replicaCount: 1

mysql:
  persistence:
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      cpu: 300m
      memory: 768Mi # MySQL 8 was OOMKilled at 384Mi during first start

ingress:
  host: selfapp.dev.local
