# Non-secret app configuration, matching the env vars docker-buildlab-selfapp's
# docker-compose.yml passes to the selfapp service (read by
# application.properties):
#   DB_HOST / DB_PORT / DB_NAME / DB_USER  -> MySQL connection
#   MQ_HOST / MQ_PORT / MQ_USER            -> RabbitMQ connection
# The passwords (DB_PASS, MQ_PASS) come from Secrets, set in app-deployment.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "selfapp.fullname" . }}-app-config
  labels:
    {{- include "selfapp.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
data:
  DB_HOST: {{ printf "%s-mysql" (include "selfapp.fullname" .) | quote }}
  DB_PORT: "3306"
  DB_NAME: {{ .Values.mysql.database | quote }}
  DB_USER: {{ .Values.mysql.username | quote }}
  {{- if .Values.rabbitmq.enabled }}
  MQ_HOST: {{ printf "%s-rabbitmq" (include "selfapp.fullname" .) | quote }}
  MQ_PORT: "5672"
  MQ_USER: {{ .Values.rabbitmq.username | quote }}
  {{- else }}
  # RabbitMQ disabled: Spring maps this env var to
  # management.health.rabbit.enabled=false, so /actuator/health doesn't
  # report DOWN and the pod can still become Ready (messaging won't work).
  MANAGEMENT_HEALTH_RABBIT_ENABLED: "false"
  {{- end }}
