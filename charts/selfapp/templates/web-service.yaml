apiVersion: v1
kind: Service
metadata:
  name: {{ include "selfapp.fullname" . }}-web
  labels:
    {{- include "selfapp.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.service.webType }}
  ports:
    - port: 80
      targetPort: {{ .Values.web.containerPort }}
      name: http
  selector:
    app.kubernetes.io/name: {{ include "selfapp.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
