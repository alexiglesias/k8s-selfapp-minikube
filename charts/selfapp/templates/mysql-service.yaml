apiVersion: v1
kind: Service
metadata:
  name: {{ include "selfapp.fullname" . }}-mysql
  labels:
    {{- include "selfapp.labels" . | nindent 4 }}
    app.kubernetes.io/component: mysql
spec:
  type: ClusterIP
  ports:
    - port: 3306
      targetPort: 3306
      name: mysql
  selector:
    app.kubernetes.io/name: {{ include "selfapp.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mysql
