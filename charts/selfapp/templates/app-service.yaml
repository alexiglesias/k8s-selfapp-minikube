apiVersion: v1
kind: Service
metadata:
  name: {{ include "selfapp.fullname" . }}-app
  labels:
    {{- include "selfapp.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  type: ClusterIP
  # Login sessions live in each app pod's memory, so always send the same
  # caller (here: the same web pod) to the same app pod.
  sessionAffinity: ClientIP
  ports:
    - port: 8080
      targetPort: {{ .Values.app.containerPort }}
      name: http
  selector:
    app.kubernetes.io/name: {{ include "selfapp.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: app
