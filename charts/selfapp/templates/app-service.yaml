apiVersion: v1
kind: Service
metadata:
  name: {{ include "selfapp.fullname" . }}-app
  labels:
    {{- include "selfapp.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: {{ .Values.app.containerPort }}
      name: http
  selector:
    app.kubernetes.io/name: {{ include "selfapp.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: app
