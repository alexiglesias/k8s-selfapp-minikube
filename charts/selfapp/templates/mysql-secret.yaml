# Storing DB credentials as a Kubernetes Secret rather than plain
# environment variables in the Deployment spec. Note that a Kubernetes
# Secret is base64-encoded, not encrypted, at rest by default on most
# clusters (Minikube included) — this is a step up from hardcoding
# passwords in YAML, not a substitute for a real secrets manager in
# production. See README "Secrets" section for how to override these
# values without committing them to Git.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "selfapp.fullname" . }}-mysql-secret
  labels:
    {{- include "selfapp.labels" . | nindent 4 }}
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: {{ .Values.mysql.rootPassword | quote }}
  MYSQL_DATABASE: {{ .Values.mysql.database | quote }}
  MYSQL_USER: {{ .Values.mysql.username | quote }}
  MYSQL_PASSWORD: {{ .Values.mysql.password | quote }}
