apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "selfapp.fullname" . }}-app
  labels:
    {{- include "selfapp.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  replicas: {{ .Values.app.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "selfapp.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "selfapp.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: app
    spec:
      # Don't let the app start scheduling traffic before MySQL can accept
      # connections. This is a blunt fixed-delay approach, not a real
      # dependency check — see README "Known gaps" for a better version
      # using an init container that polls MySQL directly.
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "selfapp.fullname" . }}-mysql 3306; do
                echo "waiting for mysql..."
                sleep 3
              done
      containers:
        - name: app
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.app.containerPort }}
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "selfapp.fullname" . }}-app-config
          env:
            # DB_PASS confirmed against docker-compose.yml's selfapp
            # service — pulled from the same Secret keys the selfdb
            # (mysql) container itself uses, just remapped to the env var
            # name the app actually reads.
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "selfapp.fullname" . }}-mysql-secret
                  key: MYSQL_PASSWORD
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          securityContext:
            # Confirmed against app/Dockerfile: the image already creates
            # and switches to a non-root user (`useradd -r -u 1001
            # appuser` / `USER 1001`). Pinning it here too means the pod
            # spec asserts the same thing the image already does, rather
            # than silently relying on the image having gotten it right.
            runAsNonRoot: true
            runAsUser: 1001
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.app.containerPort }}
            initialDelaySeconds: 30
            periodSeconds: 10
            # Confirmed against pom.xml (spring-boot-starter-actuator is
            # a real dependency) and app/Dockerfile's own HEALTHCHECK,
            # which hits this exact path. initialDelaySeconds bumped to
            # 30s to roughly match the Dockerfile's own
            # --start-period=30s for the JVM to actually come up.
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.app.containerPort }}
            initialDelaySeconds: 45
            periodSeconds: 20
