apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "selfapp.fullname" . }}-app
  labels:
    {{- include "selfapp.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  replicas: {{ .Values.app.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "selfapp.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: app
  template:
    metadata:
      annotations:
        # Fingerprints of the app's settings and passwords: if any of them
        # change, the fingerprint changes and Kubernetes restarts the app.
        checksum/config: {{ include (print $.Template.BasePath "/app-configmap.yaml") . | sha256sum }}
        checksum/secret: {{ print (include (print $.Template.BasePath "/mysql-secret.yaml") .) (include (print $.Template.BasePath "/rabbitmq-secret.yaml") .) | sha256sum }}
        {{- if .Values.app.prometheusScrape }}
        # Convention many Prometheus setups use to discover what to scrape
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.app.containerPort | quote }}
        prometheus.io/path: /actuator/prometheus
        {{- end }}
      labels:
        app.kubernetes.io/name: {{ include "selfapp.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: app
    spec:
      # Block app start-up until its dependencies accept TCP connections.
      # A TCP poll is a blunt check (see README "Known gaps"), but enough
      # to avoid the app crash-looping while MySQL/RabbitMQ boot.
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "selfapp.fullname" . }}-mysql 3306; do
                echo "waiting for mysql..."
                sleep 3
              done
        {{- if .Values.rabbitmq.enabled }}
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ include "selfapp.fullname" . }}-rabbitmq 5672; do
                echo "waiting for rabbitmq..."
                sleep 3
              done
        {{- end }}
      containers:
        - name: app
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.app.containerPort }}
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "selfapp.fullname" . }}-app-config
          env:
            # Passwords come from Secrets, remapped to the env var names the
            # app reads (same as docker-compose.yml's selfapp service).
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "selfapp.fullname" . }}-mysql-secret
                  key: MYSQL_PASSWORD
            {{- if .Values.rabbitmq.enabled }}
            - name: MQ_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "selfapp.fullname" . }}-rabbitmq-secret
                  key: RABBITMQ_DEFAULT_PASS
            {{- end }}
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          securityContext:
            # app/Dockerfile already runs as non-root user 1001; asserting it
            # here means Kubernetes refuses to start the pod if that changes.
            runAsNonRoot: true
            runAsUser: 1001
          # /actuator/health is the same endpoint app/Dockerfile's HEALTHCHECK
          # uses. Startup timing gets a proper startupProbe in Step 4.
          # Gives Spring Boot up to 5 min to start. The other two probes
          # only begin once this one has passed.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.app.containerPort }}
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.app.containerPort }}
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.app.containerPort }}
            periodSeconds: 20
