{{- if .Values.rabbitmq.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "selfapp.fullname" . }}-rabbitmq
  labels:
    {{- include "selfapp.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "selfapp.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: rabbitmq
  template:
    metadata:
      annotations:
        # Restart RabbitMQ if its username/password change, so it creates
        # the new user (it only reads them on a fresh start).
        checksum/secret: {{ include (print $.Template.BasePath "/rabbitmq-secret.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: {{ include "selfapp.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: "{{ .Values.rabbitmq.image.repository }}:{{ .Values.rabbitmq.image.tag }}"
          imagePullPolicy: {{ .Values.rabbitmq.image.pullPolicy }}
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
          envFrom:
            - secretRef:
                name: {{ include "selfapp.fullname" . }}-rabbitmq-secret
          resources:
            {{- toYaml .Values.rabbitmq.resources | nindent 12 }}
          # Same check as docker-compose.yml's selfmq healthcheck
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 20
          # Liveness only checks the AMQP port is open. It's cheap, unlike
          # rabbitmq-diagnostics, which starts a new Erlang VM each time and
          # can time out on a busy node, causing needless restarts.
          livenessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 30
            periodSeconds: 20
{{- end }}
