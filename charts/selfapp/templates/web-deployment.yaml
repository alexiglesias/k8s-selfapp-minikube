apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "selfapp.fullname" . }}-web
  labels:
    {{- include "selfapp.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "selfapp.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: web
  template:
    metadata:
      annotations:
        # Fingerprint of the nginx config: if it changes, the pods restart
        # (Kubernetes doesn't restart them for a ConfigMap change by itself)
        checksum/config: {{ include (print $.Template.BasePath "/web-configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: {{ include "selfapp.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.web.containerPort }}
              name: http
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            # Replaces the image's default.conf, same as web/Dockerfile's
            # `COPY selfapp.conf /etc/nginx/conf.d/default.conf`
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: selfapp.conf
          # Ready = "/" answers through Nginx, like web/Dockerfile's HEALTHCHECK
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.web.containerPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          # Liveness only checks Nginx is listening. Checking "/" would call
          # the app, and restart Nginx whenever the app is down.
          livenessProbe:
            tcpSocket:
              port: {{ .Values.web.containerPort }}
            initialDelaySeconds: 5
            periodSeconds: 20
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ include "selfapp.fullname" . }}-web-config
