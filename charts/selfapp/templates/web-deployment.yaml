apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "selfapp.fullname" . }}-web
  labels:
    {{- include "selfapp.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "selfapp.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "selfapp.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.web.containerPort }}
              name: http
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          volumeMounts:
            # Confirmed against the real web/Dockerfile: it does
            # `COPY selfapp.conf /etc/nginx/conf.d/default.conf`, i.e. it
            # OVERWRITES the base nginx image's default.conf rather than
            # adding a second file alongside it. My first draft mounted
            # this as a separate /etc/nginx/conf.d/selfapp.conf file,
            # which would have left both configs present and genuinely
            # conflicting (two server blocks both claiming port 80) —
            # that was a real bug, not just a hypothetical one. Mounting
            # over default.conf here replicates the Dockerfile's own
            # behavior exactly.
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: selfapp.conf
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.web.containerPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
            # Matches web/Dockerfile's own HEALTHCHECK
            # (wget --spider http://localhost/) rather than a plain TCP
            # check.
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.web.containerPort }}
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ include "selfapp.fullname" . }}-web-config
