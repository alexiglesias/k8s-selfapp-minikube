# Reverse proxy config, kept identical to docker-buildlab-selfapp's
# web/selfapp.conf except for the upstream: the Compose container name
# (selfapp:8080) is replaced by this chart's in-cluster Service name.
#
# Mounted over /etc/nginx/conf.d/default.conf (see web-deployment.yaml),
# matching the Dockerfile's `COPY selfapp.conf .../default.conf`.
#
# Security: the app serves /actuator/prometheus without login, relying on
# Nginx to keep it internal. Only /actuator/health is proxied; every other
# /actuator path returns 404 here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "selfapp.fullname" . }}-web-config
  labels:
    {{- include "selfapp.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
data:
  selfapp.conf: |
    upstream selfapp {
        server {{ include "selfapp.fullname" . }}-app:8080;
    }

    server {
        listen 80;
        server_name localhost;

        access_log /dev/stdout;
        error_log  /dev/stderr warn;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location / {
            proxy_pass http://selfapp;
        }

        # Health status (UP/DOWN only) stays public
        location = /actuator/health {
            proxy_pass http://selfapp;
        }

        # Everything else under /actuator is blocked
        location /actuator {
            return 404;
        }
    }
